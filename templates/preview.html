<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseX Airdrop</title>

  <style>
    :root {
      --bg-dark: #0b0f1a;
      --bg-card: #12182a;
      --accent: #4f7cff;
      --accent-soft: #6aa3ff;
      --accent-glow: rgba(79, 124, 255, 0.6);
      --text-main: #ffffff;
      --text-muted: #b6c0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #121a3a 0%,
        var(--bg-dark) 65%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      overflow: hidden;
    }

    /* Animated background glow */
    .bg-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      background: var(--accent);
      filter: blur(160px);
      opacity: 0.25;
      animation: floatGlow 8s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.01)
      );
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 38px 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(12px);
      animation: fadeUp 0.9s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .logo span {
      color: var(--accent);
    }

    .tagline {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
      );
      opacity: 0.45;
      margin: 22px 0;
    }

    .message {
      font-size: 15px;
      line-height: 1.6;
      color: #e6e9ff;
    }

    .status {
      margin-top: 28px;
      padding: 14px 18px;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent-soft)
      );
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 0 26px var(--accent-glow);
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #9aa6ff;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="bg-glow"></div>

  <div class="card">
    <div class="logo">
      Pulse<span>X</span>
    </div>

    <div class="tagline">
      Official Airdrop Mini App
    </div>

    <div class="divider"></div>

    <div class="message">
      Welcome to the PulseX airdrop.<br>
      Earn points, complete tasks, and prepare for the upcoming token launch.
    </div>

    <div class="status">
      Launching Dashboard…
    </div>

    <div class="hint">
      Please open this app inside Telegram
    </div>
  </div>

  <!-- Auto transition to dashboard -->
  <script>
    setTimeout(() => {
      window.location.href = "/dashboard";
    }, 3000);
  </script>

</body>
</html>

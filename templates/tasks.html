<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseX Tasks</title>

  <style>
    :root {
      --bg-dark:#0b0f1a;
      --bg-card:#12182a;
      --accent:#4f7cff;
      --accent-glow:rgba(79,124,255,.6);
      --text:#fff;
      --muted:#b6c0ff;
      --success:#3ddc97;
    }

    * {margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto,Arial}

    body {
      background:radial-gradient(circle at top,#121a3a,var(--bg-dark));
      color:var(--text);
      padding:18px;
      min-height:100vh;
    }

    h2 {margin-bottom:16px}

    .card {
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
      animation:fadeUp .6s ease;
    }

    .task {
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .task span {
      font-size:14px;
      color:var(--muted);
    }

    button {
      background:linear-gradient(135deg,var(--accent),#6aa3ff);
      border:none;
      border-radius:10px;
      padding:10px 14px;
      color:#fff;
      font-weight:600;
      box-shadow:0 0 18px var(--accent-glow);
    }

    @keyframes fadeUp {
      from {opacity:0;transform:translateY(20px)}
      to {opacity:1;transform:translateY(0)}
    }

    .nav {
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(10,14,30,.85);
      display:flex;justify-content:space-around;
      padding:12px 0;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .nav a {
      color:var(--muted);
      font-size:12px;
      text-decoration:none;
    }

    .nav a.active {color:var(--accent)}
  </style>
</head>
<body>

<h2>Tasks</h2>

<div class="card task">
  <span>Join Telegram Channel</span>
  <button>Verify</button>
</div>

<div class="card task">
  <span>Follow on Twitter</span>
  <button>Verify</button>
</div>

<div class="card task">
  <span>Invite 1 Friend</span>
  <button>Verify</button>
</div>

<div class="nav">
  <a href="/dashboard">Dashboard</a>
  <a class="active" href="/tasks">Tasks</a>
  <a href="/referrals">Referrals</a>
  <a href="/wallet">Wallet</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulsex Tasks</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="dashboard">

    <!-- HEADER -->
    <header class="top-bar">
      <h2>Tasks</h2>
      <span class="username">@username</span>
    </header>

    <!-- TASK LIST -->
    <div class="task-card">
      <h3>Join Telegram Channel</h3>
      <p>Stay updated with official announcements.</p>
      <span class="reward">+20 Points</span>
      <button class="task-btn">Verify & Claim</button>
    </div>

    <div class="task-card">
      <h3>Follow on X (Twitter)</h3>
      <p>Support the project on social media.</p>
      <span class="reward">+20 Points</span>
      <button class="task-btn">Verify & Claim</button>
    </div>

    <div class="task-card completed">
      <h3>Visit Website</h3>
      <p>Learn more about the Pulsex ecosystem.</p>
      <span class="reward">Completed</span>
      <button class="task-btn" disabled>Completed</button>
    </div>

    <!-- NAV -->
    <nav class="bottom-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/tasks" class="active">Tasks</a>
      <a href="/referrals">Referrals</a>
      <a href="/wallet">Wallet</a>
    </nav>

  </div>

</body>
</html>

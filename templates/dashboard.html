<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1d2a, #050b12);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .username {
      font-size: 14px;
      opacity: 0.85;
    }

    .wallet {
      font-size: 18px;
      cursor: pointer;
    }

    /* POINTS + COIN */
    .points-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 10px;
    }

    .points {
      font-size: 42px;
      font-weight: bold;
    }

    .coin {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: transparent;
      box-shadow: none;
      display: block;
    }

    .airdrop {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .claim-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, #00c6ff, #0072ff);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(0, 114, 255, 0.6);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .claim-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .claim-btn:active {
      transform: scale(0.96);
    }

    .countdown {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.85;
    }

    /* BOTTOM NAV */
    .nav {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      background: linear-gradient(to top, rgba(5,11,18,0.95), rgba(5,11,18,0.7));
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav div {
      font-size: 14px;
      opacity: 0.9;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <div class="username" id="username">Loading...</div>
      <div class="wallet">👛</div>
    </div>

    <div class="points-row">
      <div class="points" id="points">0</div>
      <img src="/static/pulsex-coin.png" alt="PulseX Coin" class="coin" />
    </div>

    <div class="airdrop">Airdrop eligibility: Active</div>

    <button class="claim-btn" id="claimBtn">CLAIM</button>
    <div class="countdown" id="countdown">Checking cooldown...</div>

  </div>

  <div class="nav">
    <div>⚡ Upgrade</div>
    <div>🔋 Battery</div>
    <div>🎁 Airdrop</div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  const user = tg.initDataUnsafe?.user;
  const userId = user?.id;
  const username = user?.username ? "@" + user.username : "User";

  const pointsEl = document.getElementById("points");
  const usernameEl = document.getElementById("username");
  const claimBtn = document.getElementById("claimBtn");
  const countdownEl = document.getElementById("countdown");

  let cooldownSeconds = 0;
  let countdownTimer = null;

  usernameEl.textContent = username;

  async function loadUser() {
    if (!userId) {
      countdownEl.textContent = "Telegram user not detected";
      claimBtn.disabled = true;
      return;
    }

    const res = await fetch(`/api/user/${userId}?username=${encodeURIComponent(username)}`);
    const data = await res.json();

    pointsEl.textContent = data.points;
    cooldownSeconds = data.next_claim_in || 0;

    updateUI();
  }

  function updateUI() {
    clearInterval(countdownTimer);

    if (cooldownSeconds <= 0) {
      countdownEl.textContent = "Claim available";
      claimBtn.disabled = false;
      return;
    }

    claimBtn.disabled = true;

    countdownTimer = setInterval(() => {
      cooldownSeconds--;

      if (cooldownSeconds <= 0) {
        clearInterval(countdownTimer);
        countdownEl.textContent = "Claim available";
        claimBtn.disabled = false;
      } else {
        const h = Math.floor(cooldownSeconds / 3600);
        const m = Math.floor((cooldownSeconds % 3600) / 60);
        const s = cooldownSeconds % 60;
        countdownEl.textContent = `Next claim in ${h}h ${m}m ${s}s`;
      }
    }, 1000);
  }

  claimBtn.addEventListener("click", async () => {
    claimBtn.disabled = true;

    const res = await fetch("/api/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, username })
    });

    const data = await res.json();

    if (data.success) {
      pointsEl.textContent = data.points;
      cooldownSeconds = data.next_claim_in;
    }

    updateUI();
  });

  loadUser();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top, #1b1f3b, #0b0d1a);
      color: #fff;
    }

    .dashboard {
      max-width: 420px;
      margin: auto;
      padding: 16px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .username {
      font-size: 13px;
      opacity: 0.85;
    }

    .balance-card {
      background: linear-gradient(135deg, #6a5cff, #00d4ff);
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      margin-bottom: 18px;
    }

    .balance-card .label {
      font-size: 13px;
      opacity: 0.9;
    }

    #points {
      font-size: 42px;
      font-weight: 800;
      margin: 6px 0;
    }

    .unit {
      font-size: 12px;
      opacity: 0.85;
    }

    .countdown-card {
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    #countdown {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
      color: #00ffcc;
    }

    .claim-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #00ffcc, #00bfff);
      color: #000;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(0,255,204,0.35);
    }

    .claim-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      margin-top: 26px;
      font-size: 12px;
      opacity: 0.85;
    }

    .bottom-nav a {
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="dashboard">

    <header class="top-bar">
      <h2>PulseX</h2>
      <span class="username" id="username">@loading…</span>
    </header>

    <div class="balance-card">
      <p class="label">Your Balance</p>
      <h1 id="points">0</h1>
      <span class="unit">PULSE POINTS</span>
    </div>

    <div class="countdown-card">
      <p>Next claim available in</p>
      <h3 id="countdown">--:--:--</h3>
    </div>

    <button class="claim-btn" id="claimBtn">
      Claim Reward
    </button>

    <nav class="bottom-nav">
      <a href="#">Dashboard</a>
      <a href="#">Upgrade</a>
      <a href="#">Boost</a>
      <a href="#">Wallet</a>
    </nav>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();

    const userId = tg?.initDataUnsafe?.user?.id;
    const username =
      tg?.initDataUnsafe?.user?.username
        ? "@" + tg.initDataUnsafe.user.username
        : "@user";

    const API_BASE = "";

    document.getElementById("username").innerText = username;

    let nextClaimSeconds = 0;
    let countdownInterval = null;

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startCountdown() {
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        if (nextClaimSeconds <= 0) {
          document.getElementById("countdown").innerText = "Available";
          document.getElementById("claimBtn").disabled = false;
          clearInterval(countdownInterval);
          return;
        }
        nextClaimSeconds--;
        document.getElementById("countdown").innerText = formatTime(nextClaimSeconds);
      }, 1000);
    }

    async function loadUser() {
      const res = await fetch(`/api/user/${userId}?username=${encodeURIComponent(username)}`);
      const data = await res.json();

      document.getElementById("points").innerText = data.points;
      nextClaimSeconds = data.next_claim_in;

      if (nextClaimSeconds > 0) {
        document.getElementById("claimBtn").disabled = true;
        startCountdown();
      } else {
        document.getElementById("countdown").innerText = "Available";
        document.getElementById("claimBtn").disabled = false;
      }
    }

    document.getElementById("claimBtn").addEventListener("click", async () => {
      document.getElementById("claimBtn").disabled = true;

      const res = await fetch("/api/claim", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: userId,
          username: username
        })
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById("points").innerText = data.points;
        nextClaimSeconds = data.next_claim_in;
        startCountdown();
      } else {
        alert(data.message || "Claim not available yet");
        document.getElementById("claimBtn").disabled = false;
      }
    });

    loadUser();
  </script>
</body>
</html>

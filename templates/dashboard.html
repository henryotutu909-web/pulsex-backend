<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PulseX Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0b0f1a, #12172a);
            color: #fff;
        }

        .container {
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-btn {
            background: #1f2a44;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .points-box {
            margin-top: 25px;
            text-align: center;
            background: #161c33;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.15);
        }

        .points {
            font-size: 38px;
            font-weight: bold;
            color: #00c2ff;
        }

        .countdown {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .claim-btn {
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00c2ff, #0066ff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
        }

        .claim-btn:disabled {
            background: #333;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 12px;
        }

        .action-card {
            flex: 1;
            background: #161c33;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
        }

        .action-card span {
            display: block;
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .username {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div><strong>PulseX</strong></div>
        <div class="wallet-btn" onclick="window.location.href='/wallet'">
            🔗 Wallet
        </div>
    </div>

    <!-- POINTS -->
    <div class="points-box">
        <div class="points" id="points">0</div>
        <div class="countdown" id="countdown">Loading...</div>

        <button class="claim-btn" id="claimBtn" onclick="claimPoints()">
            Claim
        </button>

        <div class="username" id="username">Loading user...</div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">

        <!-- UPGRADE -->
        <div class="action-card" onclick="window.location.href='/upgrade'">
            🚀
            <span>Upgrade</span>
        </div>

        <!-- BATTERY -->
        <div class="action-card" onclick="window.location.href='/battery'">
            🔋
            <span>Boost</span>
        </div>

        <!-- AIRDROP -->
        <div class="action-card" onclick="alert('Airdrop info coming soon')">
            🎁
            <span>Airdrop</span>
        </div>

    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const userId = tg.initDataUnsafe?.user?.id;
    const username = tg.initDataUnsafe?.user?.username || "Guest";

    document.getElementById("username").innerText = "@" + username;

    function fetchUser() {
        fetch(`/api/user/${userId}?username=@${username}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("points").innerText = data.points;

                if (data.next_claim_in > 0) {
                    startCountdown(data.next_claim_in);
                    document.getElementById("claimBtn").disabled = true;
                } else {
                    document.getElementById("countdown").innerText = "Available";
                    document.getElementById("claimBtn").disabled = false;
                }
            });
    }

    function startCountdown(seconds) {
        const el = document.getElementById("countdown");
        let remaining = seconds;

        const interval = setInterval(() => {
            if (remaining <= 0) {
                el.innerText = "Available";
                document.getElementById("claimBtn").disabled = false;
                clearInterval(interval);
            } else {
                const h = Math.floor(remaining / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const s = remaining % 60;
                el.innerText = `${h}h ${m}m ${s}s`;
                remaining--;
            }
        }, 1000);
    }

    function claimPoints() {
        fetch("/api/claim", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ user_id: userId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                fetchUser();
            } else {
                alert(data.message || "Claim not available yet");
            }
        });
    }

    fetchUser();
</script>

</body>
</html>

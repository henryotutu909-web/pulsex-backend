<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PulseX Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0b0f1a, #111827);
            color: #fff;
        }

        .container {
            padding: 20px;
            max-width: 420px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username {
            font-size: 14px;
            opacity: 0.8;
        }

        .wallet {
            font-size: 18px;
            cursor: pointer;
        }

        .balance-box {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .points {
            font-size: 36px;
            font-weight: bold;
        }

        .claim-btn {
            margin-top: 15px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            background: #22c55e;
            color: #000;
            cursor: pointer;
        }

        .claim-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .countdown {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background: #1f2933;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
        }

        .action-btn:hover {
            background: #374151;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Top -->
    <div class="top-bar">
        <div class="username" id="username">@loading...</div>
        <div class="wallet">👛</div>
    </div>

    <!-- Balance -->
    <div class="balance-box">
        <div class="points" id="points">0</div>
        <div>PulseX Points</div>

        <button class="claim-btn" id="claimBtn" onclick="claim()">Claim</button>
        <div class="countdown" id="countdown"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <a href="/upgrade" class="action-btn">⚡ Upgrade</a>
        <a href="/wallet" class="action-btn">➕ Battery</a>
    </div>

</div>

<script>
    const tg = window.Telegram?.WebApp;
    const user = tg?.initDataUnsafe?.user;

    const userId = user?.id;
    const username = user?.username ? "@" + user.username : "Guest";

    document.getElementById("username").innerText = username;

    async function loadUser() {
        const res = await fetch(`/api/user/${userId}?username=${username}`);
        const data = await res.json();

        document.getElementById("points").innerText = data.points;

        if (data.next_claim_in > 0) {
            disableClaim(data.next_claim_in);
        }
    }

    function disableClaim(seconds) {
        const btn = document.getElementById("claimBtn");
        btn.disabled = true;

        const cd = document.getElementById("countdown");
        let remaining = seconds;

        const interval = setInterval(() => {
            if (remaining <= 0) {
                btn.disabled = false;
                cd.innerText = "Claim available";
                clearInterval(interval);
            } else {
                const h = Math.floor(remaining / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const s = remaining % 60;
                cd.innerText = `Next claim in ${h}h ${m}m ${s}s`;
                remaining--;
            }
        }, 1000);
    }

    async function claim() {
        const res = await fetch("/api/claim", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: userId, username })
        });

        const data = await res.json();
        if (data.success) {
            loadUser();
        } else {
            alert(data.error || "Claim not available");
        }
    }

    loadUser();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pulsex Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #0f172a, #020617);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e7eb;
    }

    .dashboard {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top-bar h2 {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }

    .username {
      font-size: 13px;
      opacity: 0.8;
    }

    .card {
      background: linear-gradient(160deg, #020617, #020617);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.08);
    }

    .balance {
      text-align: center;
    }

    .balance p {
      font-size: 13px;
      opacity: 0.7;
    }

    .balance h1 {
      margin: 10px 0;
      font-size: 42px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .unit {
      font-size: 12px;
      opacity: 0.6;
    }

    .countdown {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #facc15;
      letter-spacing: 1px;
    }

    .claim-btn {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      color: #020617;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .claim-btn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .bottom-nav a {
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
    }

    .bottom-nav a.active {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="dashboard">

    <!-- HEADER -->
    <div class="top-bar">
      <h2>Pulsex Airdrop</h2>
      <span class="username" id="username">@user</span>
    </div>

    <!-- BALANCE -->
    <div class="card balance">
      <p>Your Balance</p>
      <h1 id="points">0</h1>
      <span class="unit">PULSE POINTS</span>
    </div>

    <!-- COUNTDOWN -->
    <div class="card">
      <p style="text-align:center; opacity:0.7; font-size:13px;">
        Next claim available in
      </p>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>

    <!-- CLAIM -->
    <button class="claim-btn" id="claimBtn">Claim Daily Reward</button>

    <!-- NAV -->
    <div class="bottom-nav">
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/tasks">Tasks</a>
      <a href="/referrals">Referrals</a>
      <a href="/wallet">Wallet</a>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const user = tg.initDataUnsafe?.user || {};
    const telegramId = user.id;
    const username = user.username || "guest";

    document.getElementById("username").textContent = "@" + username;

    const pointsEl = document.getElementById("points");
    const countdownEl = document.getElementById("countdown");
    const claimBtn = document.getElementById("claimBtn");

    let timer = null;

    function startCountdown(target) {
      if (timer) clearInterval(timer);

      function tick() {
        const now = new Date();
        const diff = target - now;

        if (diff <= 0) {
          countdownEl.textContent = "Ready to claim";
          claimBtn.disabled = false;
          clearInterval(timer);
          return;
        }

        claimBtn.disabled = true;

        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        countdownEl.textContent =
          `${String(h).padStart(2, "0")}:` +
          `${String(m).padStart(2, "0")}:` +
          `${String(s).padStart(2, "0")}`;
      }

      tick();
      timer = setInterval(tick, 1000);
    }

    fetch(`/api/user/${telegramId}?username=${username}`)
      .then(r => r.json())
      .then(data => {
        pointsEl.textContent = data.points || 0;

        if (data.next_claim) {
          startCountdown(new Date(data.next_claim));
        } else {
          countdownEl.textContent = "Ready to claim";
          claimBtn.disabled = false;
        }
      });

    claimBtn.onclick = () => {
      claimBtn.disabled = true;
      claimBtn.textContent = "Claiming…";

      fetch("/api/claim", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          telegram_id: telegramId,
          username: username
        })
      })
        .then(r => r.json())
        .then(data => {
          if (!data.success) {
            alert(data.error || "Claim failed");
            claimBtn.disabled = false;
            return;
          }

          pointsEl.textContent = data.points;
          Telegram.WebApp.HapticFeedback.impactOccurred("medium");
          startCountdown(new Date(data.next_claim));
        })
        .finally(() => {
          claimBtn.textContent = "Claim Daily Reward";
        });
    };
  </script>
</body>
</html>

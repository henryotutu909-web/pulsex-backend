<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Dashboard</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background: #0b0f1a;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: #141a2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      color: #4fd1ff;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #4fd1ff, #8b5cf6);
      color: #000;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    nav {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h3 id="username">@loading</h3>
</div>

<div class="card">
  <p>Your Balance</p>
  <div class="balance" id="points">0</div>
</div>

<div class="card">
  <p id="countdown">Loading...</p>
</div>

<button id="claimBtn">Claim Daily Reward</button>

<nav>
  <a href="/dashboard">Dashboard</a>
  <a href="/tasks">Tasks</a>
  <a href="/referrals">Referrals</a>
  <a href="/wallet">Wallet</a>
</nav>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  const user = tg.initDataUnsafe?.user;

  if (!user || !user.id) {
    alert("Telegram user not detected. Open inside Telegram.");
  }

  const telegramId = user.id;
  const username = user.username || "user";

  document.getElementById("username").innerText = "@" + username;

  const pointsEl = document.getElementById("points");
  const countdownEl = document.getElementById("countdown");
  const claimBtn = document.getElementById("claimBtn");

  let nextClaimTime = null;

  function updateCountdown() {
    if (!nextClaimTime) return;

    const diff = nextClaimTime - new Date();
    if (diff <= 0) {
      countdownEl.innerText = "Claim available";
      claimBtn.disabled = false;
      return;
    }

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    countdownEl.innerText = `Next claim in ${h}h ${m}m ${s}s`;
    claimBtn.disabled = true;
  }

  function loadUser() {
    fetch(`/api/user/${telegramId}?username=${username}`)
      .then(res => res.json())
      .then(data => {
        pointsEl.innerText = data.points;

        if (data.next_claim) {
          nextClaimTime = new Date(data.next_claim);
          updateCountdown();
          setInterval(updateCountdown, 1000);
        } else {
          countdownEl.innerText = "Claim available";
        }
      });
  }

  claimBtn.onclick = () => {
    claimBtn.disabled = true;

    fetch("/api/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: telegramId })
    })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
          claimBtn.disabled = false;
          return;
        }

        pointsEl.innerText = data.points;
        nextClaimTime = new Date(data.next_claim);
      });
  };

  loadUser();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: linear-gradient(135deg, #0b0f1a, #111827);
      color: #fff;
    }

    .dashboard {
      max-width: 420px;
      margin: auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .balance-card,
    .countdown-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
      animation: fadeUp 0.6s ease;
    }

    .balance-card h1 {
      font-size: 42px;
      margin: 10px 0;
      color: #22c55e;
    }

    .claim-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .claim-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .claim-btn:active {
      transform: scale(0.97);
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      font-size: 14px;
    }

    .bottom-nav a {
      color: #9ca3af;
      text-decoration: none;
    }

    .bottom-nav a.active {
      color: #22c55e;
      font-weight: 600;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="dashboard">

  <div class="top-bar">
    <h3>PulseX</h3>
    <span id="username">@user</span>
  </div>

  <div class="balance-card">
    <p>Your Balance</p>
    <h1 id="points">0</h1>
    <span>PULSE POINTS</span>
  </div>

  <div class="countdown-card">
    <p>Next claim available in</p>
    <h3 id="countdown">--:--:--</h3>
  </div>

  <button class="claim-btn" id="claimBtn" onclick="claimReward()">
    Claim Daily Reward
  </button>

  <nav class="bottom-nav">
    <a href="/dashboard" class="active">Dashboard</a>
    <a href="/tasks">Tasks</a>
    <a href="/referrals">Referrals</a>
    <a href="/wallet">Wallet</a>
  </nav>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  const telegramId = tg.initDataUnsafe?.user?.id;
  const username = tg.initDataUnsafe?.user?.username || "guest";

  document.getElementById("username").innerText = "@" + username;

  async function loadUser() {
    const res = await fetch(`/api/user/${telegramId}?username=${username}`);
    const data = await res.json();

    document.getElementById("points").innerText = data.points;
    if (data.next_claim) startCountdown(data.next_claim);
  }

  async function claimReward() {
    const btn = document.getElementById("claimBtn");
    btn.disabled = true;
    btn.innerText = "Claiming...";

    const res = await fetch("/api/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        telegram_id: telegramId,
        username: username
      })
    });

    const data = await res.json();

    if (data.error) {
      alert(data.error);
    } else {
      document.getElementById("points").innerText = data.points;
      startCountdown(data.next_claim);
      tg.HapticFeedback.impactOccurred("medium");
    }

    btn.disabled = false;
    btn.innerText = "Claim Daily Reward";
  }

  function startCountdown(nextClaim) {
    const end = new Date(nextClaim).getTime();

    setInterval(() => {
      const now = Date.now();
      const diff = end - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerText = "00:00:00";
        return;
      }

      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      document.getElementById("countdown").innerText =
        `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    }, 1000);
  }

  loadUser();
</script>

</body>
</html>

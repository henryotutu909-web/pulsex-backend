<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseX Referrals</title>

  <style>
    :root {
      --bg-dark:#0b0f1a;
      --bg-card:#12182a;
      --accent:#4f7cff;
      --text:#fff;
      --muted:#b6c0ff;
    }

    * {margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}

    body {
      background:radial-gradient(circle at top,#121a3a,var(--bg-dark));
      color:var(--text);
      padding:18px;
      min-height:100vh;
    }

    h2 {margin-bottom:14px}

    .card {
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
      animation:fade .6s ease;
    }

    .link {
      word-break:break-all;
      font-size:13px;
      color:var(--muted);
      margin-top:8px;
    }

    @keyframes fade {
      from {opacity:0}
      to {opacity:1}
    }

    .nav {
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(10,14,30,.85);
      display:flex;justify-content:space-around;
      padding:12px 0;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .nav a {color:var(--muted);font-size:12px;text-decoration:none}
    .nav a.active {color:var(--accent)}
  </style>
</head>
<body>

<h2>Referrals</h2>

<div class="card">
  <div>Total Referrals</div>
  <h1>0</h1>
</div>

<div class="card">
  <div>Your Referral Link</div>
  <div class="link">
    https://t.me/pulsex_airdrop_bot?start=123456
  </div>
</div>

<div class="nav">
  <a href="/dashboard">Dashboard</a>
  <a href="/tasks">Tasks</a>
  <a class="active" href="/referrals">Referrals</a>
  <a href="/wallet">Wallet</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <title>Connect Wallet</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="dashboard">

    <header class="top-bar">
      <h2>Wallet</h2>
      <span class="username" id="username">@loading</span>
    </header>

    <div class="wallet-card">
      <p>Connected Wallet</p>
      <input
        type="text"
        id="walletInput"
        placeholder="Enter your wallet address"
      >
      <button class="wallet-btn primary" onclick="saveWallet()">
        Save Wallet
      </button>
    </div>

    <div class="security-note">
      <p>
        🔒 We will never ask for your private key or recovery phrase.
        Wallet connection is only used for airdrop distribution.
      </p>
    </div>

    <nav class="bottom-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/tasks">Tasks</a>
      <a href="/referrals">Referrals</a>
      <a href="/wallet" class="active">Wallet</a>
    </nav>

  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>

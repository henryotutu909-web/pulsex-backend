<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseX Wallet</title>

  <style>
    :root {
      --bg-dark:#0b0f1a;
      --bg-card:#12182a;
      --accent:#4f7cff;
      --accent-glow:rgba(79,124,255,.6);
      --text:#fff;
      --muted:#b6c0ff;
    }

    * {margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}

    body {
      background:radial-gradient(circle at top,#121a3a,var(--bg-dark));
      color:var(--text);
      padding:18px;
      min-height:100vh;
    }

    h2 {margin-bottom:16px}

    .card {
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:18px;
      animation:fadeUp .6s ease;
    }

    input {
      width:100%;
      padding:14px;
      border-radius:12px;
      border:none;
      outline:none;
      margin-top:12px;
      background:#0e1430;
      color:#fff;
    }

    button {
      margin-top:16px;
      width:100%;
      padding:14px;
      border-radius:14px;
      border:none;
      background:linear-gradient(135deg,var(--accent),#6aa3ff);
      color:#fff;
      font-weight:600;
      box-shadow:0 0 22px var(--accent-glow);
    }

    @keyframes fadeUp {
      from {opacity:0;transform:translateY(20px)}
      to {opacity:1;transform:translateY(0)}
    }

    .nav {
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(10,14,30,.85);
      display:flex;justify-content:space-around;
      padding:12px 0;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .nav a {color:var(--muted);font-size:12px;text-decoration:none}
    .nav a.active {color:var(--accent)}
  </style>
</head>
<body>

<h2>Wallet</h2>

<div class="card">
  <div>Connect Your Wallet</div>
  <input type="text" placeholder="Enter wallet address">
  <button>Save Wallet</button>
</div>

<div class="nav">
  <a href="/dashboard">Dashboard</a>
  <a href="/tasks">Tasks</a>
  <a href="/referrals">Referrals</a>
  <a class="active" href="/wallet">Wallet</a>
</div>

</body>
</html>

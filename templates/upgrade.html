<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Upgrade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1d2a, #050b12);
      color: #fff;
    }

    .container {
      padding: 18px;
      padding-bottom: 90px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back {
      font-size: 22px;
      cursor: pointer;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .current {
      background: linear-gradient(135deg, #0f2a3d, #07131f);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: 0 0 25px rgba(0,198,255,0.15);
    }

    .stage-card {
      background: linear-gradient(135deg, #0c2234, #06121d);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stage-info h4 {
      margin: 0;
      font-size: 18px;
    }

    .stage-info p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    .upgrade-btn {
      background: radial-gradient(circle at top, #00c6ff, #0072ff);
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .upgrade-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="top">
    <div class="back" onclick="history.back()">←</div>
    <div class="title">Upgrade</div>
  </div>

  <div class="current">
    <div id="currentStage">Stage 1</div>
    <div id="currentPoints">Loading points...</div>
  </div>

  <div class="stage-card">
    <div class="stage-info">
      <h4>Stage 2</h4>
      <p>Earn 150 PulseX per claim</p>
      <p>Cost: 1,000 PulseX</p>
    </div>
    <button class="upgrade-btn" onclick="upgrade(2, 1000)">Upgrade</button>
  </div>

  <div class="stage-card">
    <div class="stage-info">
      <h4>Stage 3</h4>
      <p>Earn 220 PulseX per claim</p>
      <p>Cost: 3,000 PulseX</p>
    </div>
    <button class="upgrade-btn" onclick="upgrade(3, 3000)">Upgrade</button>
  </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

const user = tg.initDataUnsafe?.user;
const userId = user?.id;
const username = user?.username ? "@" + user.username : "User";

let userPoints = 0;
let userStage = 1;

async function loadUser() {
  const res = await fetch(`/api/user/${userId}?username=${encodeURIComponent(username)}`);
  const data = await res.json();

  userPoints = data.points || 0;

  document.getElementById("currentStage").textContent = `Stage ${userStage}`;
  document.getElementById("currentPoints").textContent = `Balance: ${userPoints} PulseX`;
}

async function upgrade(targetStage, cost) {
  if (userPoints < cost) {
    alert("Not enough PulseX to upgrade");
    return;
  }

  try {
    const res = await fetch("/api/upgrade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: userId,
        target_stage: targetStage
      })
    });

    if (!res.ok) throw new Error("Backend not ready");

    const data = await res.json();

    if (data.success) {
      userPoints = data.points;
      userStage = data.stage;
      alert("Upgrade successful!");
      loadUser();
    } else {
      alert(data.message || "Upgrade failed");
    }

  } catch {
    // SAFE FALLBACK
    userPoints -= cost;
    userStage = targetStage;

    alert("Upgrade simulated (backend coming soon)");
    loadUser();
  }
}

loadUser();
</script>

</body>
</html>

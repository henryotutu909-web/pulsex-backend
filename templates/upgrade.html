<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseX Upgrade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1d2a, #050b12);
      color: #fff;
    }

    .container {
      padding: 18px;
      padding-bottom: 90px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back {
      font-size: 22px;
      cursor: pointer;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .current {
      background: linear-gradient(135deg, #0f2a3d, #07131f);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: 0 0 25px rgba(0,198,255,0.15);
    }

    .stage-card {
      background: linear-gradient(135deg, #0c2234, #06121d);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stage-info h4 {
      margin: 0;
      font-size: 18px;
    }

    .stage-info p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.75;
    }

    .upgrade-btn {
      background: radial-gradient(circle at top, #00c6ff, #0072ff);
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .upgrade-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="top">
    <div class="back" onclick="history.back()">←</div>
    <div class="title">Upgrade</div>
  </div>

  <div class="current">
    <div id="currentStage">Loading stage...</div>
    <div id="currentPoints">Loading points...</div>
  </div>

  <div class="stage-card">
    <div class="stage-info">
      <h4>Stage 2</h4>
      <p>Earn more PulseX per claim</p>
      <p>Cost increases with level</p>
    </div>
    <button class="upgrade-btn" id="btn2" onclick="upgrade()">Upgrade</button>
  </div>

  <div class="stage-card">
    <div class="stage-info">
      <h4>Stage 3</h4>
      <p>Earn more PulseX per claim</p>
      <p>Cost increases with level</p>
    </div>
    <button class="upgrade-btn" id="btn3" disabled>Upgrade</button>
  </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

const user = tg.initDataUnsafe?.user;
const userId = user?.id;
const username = user?.username ? "@" + user.username : "User";

let userPoints = 0;
let userLevel = 1;

async function loadUser() {
  const res = await fetch(`/api/user/${userId}?username=${encodeURIComponent(username)}`);
  const data = await res.json();

  userPoints = data.points || 0;
  userLevel = data.level || 1;

  document.getElementById("currentStage").textContent = `Stage ${userLevel}`;
  document.getElementById("currentPoints").textContent = `Balance: ${userPoints} PulseX`;

  // Enable ONLY next level button
  document.getElementById("btn2").disabled = userLevel !== 1;
  document.getElementById("btn3").disabled = userLevel !== 2;
}

async function upgrade() {
  const res = await fetch("/api/upgrade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId })
  });

  const data = await res.json();

  if (data.success) {
    alert(`Upgraded to Stage ${data.new_level}`);
    loadUser();
  } else {
    alert(data.message || "Upgrade failed");
  }
}

loadUser();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PulseX Upgrade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0b0f1a, #111827);
            color: #fff;
        }

        .container {
            padding: 20px;
            max-width: 420px;
            margin: auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back {
            font-size: 20px;
            cursor: pointer;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .card {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .level {
            font-size: 22px;
            font-weight: bold;
        }

        .stat {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.85;
        }

        .upgrade-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="back" onclick="history.back()">←</div>
        <div class="title">Upgrade</div>
    </div>

    <!-- Current Level -->
    <div class="card">
        <div class="level">Level 1 · Starter</div>
        <div class="stat">Points per claim: <b>+10</b></div>
        <div class="stat">Claim cooldown: <b>6 hours</b></div>
    </div>

    <!-- Next Level -->
    <div class="card">
        <div class="level">Next Level · Booster</div>
        <div class="stat">Points per claim: <b>+20</b></div>
        <div class="stat">Upgrade cost: <b>1,000 Points</b></div>

        <button class="upgrade-btn">Upgrade (Coming Soon)</button>
        <div class="hint">
            Upgrades will be enabled after launch
        </div>
    </div>

</div>

</body>
</html>
